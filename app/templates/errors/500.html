{% extends "base.html" %}

{% block title %}500 – Server Error{{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm">
            <div class="card-header bg-danger text-white">
                <h3 class="mb-0">500 – Server Error</h3>
            </div>
            <div class="card-body py-5">
                <p class="lead">Something went wrong on our end.</p>
                <p class="text-muted">The error has been logged and will be reviewed by the administrators.</p>
                <a href="{{ url_for('main.index') }}" class="btn btn-green">Return Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
